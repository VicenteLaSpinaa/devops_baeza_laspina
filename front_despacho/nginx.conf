# ============================================================
# nginx.conf — Configuración de Nginx para el Frontend React
# ============================================================
# Este archivo configura Nginx para:
# 1. Servir los archivos estáticos generados por Vite (React)
# 2. Actuar como reverse proxy (intermediario) que redirige
#    las peticiones /api/ventas/* al contenedor backend-ventas
#    y /api/despachos/* al contenedor backend-despachos.
# 3. Manejar el enrutamiento SPA (Single Page Application):
#    cualquier ruta que no sea un archivo real se redirige a
#    index.html para que React Router maneje la navegación.
# ============================================================

# ---- Bloque server: define cómo Nginx escucha y responde ----
server {
    # Puerto 80 dentro del contenedor (HTTP estándar)
    listen 80;

    # Nombre del servidor. Acepta cualquier dominio/IP.
    server_name _;

    # ---- Ubicación raíz: archivos estáticos de React ----
    # Todas las peticiones que NO coincidan con /api/* llegan aquí
    location / {
        # Directorio donde Vite deposita los archivos compilados
        root /usr/share/nginx/html;

        # Intenta servir el archivo solicitado. Si no existe,
        # devuelve index.html (para que React Router funcione)
        try_files $uri $uri/ /index.html;
    }

    # ---- Reverse proxy hacia Backend Ventas (puerto 8080) ----
    # Captura toda petición cuya ruta empiece con /api/ventas/
    # Ejemplo: GET /api/ventas → se reenvía a backend-ventas:8080/api/v1/ventas
    location /api/ventas/ {
        # Redirige la petición al servicio "backend-ventas" definido
        # en docker-compose. Docker resuelve ese nombre a la IP interna.
        proxy_pass http://backend-ventas:8080/api/v1/ventas/;

        # Reescribe la cabecera Host para que el backend reciba
        # el nombre del host original del cliente, no "backend-ventas"
        proxy_set_header Host $host;

        # Reenvía la IP real del cliente al backend
        proxy_set_header X-Real-IP $remote_addr;

        # Cadena de proxies por los que pasó la petición
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Protocolo original (http o https) para que el backend
        # sepa si la conexión del cliente era segura
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Reverse proxy hacia Backend Despachos (puerto 8081) ----
    # Captura toda petición cuya ruta empiece con /api/despachos/
    # Ejemplo: POST /api/despachos → se reenvía a backend-despachos:8081/api/v1/despachos
    location /api/despachos/ {
        # Redirige al servicio "backend-despachos" del docker-compose
        proxy_pass http://backend-despachos:8081/api/v1/despachos/;

        # Mismas cabeceras de proxy que el bloque anterior
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
