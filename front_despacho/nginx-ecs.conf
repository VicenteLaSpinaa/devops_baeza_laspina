# nginx-ecs.conf — Nginx para ECS Fargate con ALB



server {
    listen 80;
    server_name _;

    # Health check para el ALB Target Group
    location /health {
        access_log off;
        return 200 '{"status":"ok","service":"frontend"}';
        add_header Content-Type application/json;
    }

    # Archivos estáticos de React
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
