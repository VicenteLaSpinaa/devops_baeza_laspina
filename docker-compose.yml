# Define los 5 servicios de la aplicación (frontend, 2 backends y sus respectivas bases de datos).
# Usa dos redes internas para seguridad: front-back para conectar el frontend con los APIs,
# y back-db para conectar los APIs con MySQL, impidiendo accesos directos desde fuera.

version: "3.8"

services:

  # MySQL para el microservicio de Ventas. No expone puertos fuera de la red back-db.
  mysql-ventas:
    image: mysql:8.0
    container_name: mysql-ventas
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password_ventas
      MYSQL_DATABASE: db_ventas
      MYSQL_USER: user_ventas
      MYSQL_PASSWORD: pass_ventas
    # Para no perder los datos al apagar el contenedor
    volumes:
      - mysql-ventas-data:/var/lib/mysql
    networks:
      - back-db
    # Verifica que la base de datos esté lista antes de que las APIs intenten conectar
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password_ventas"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s


  # MySQL para Despachos
  mysql-despachos:
    image: mysql:8.0
    container_name: mysql-despachos
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password_despachos
      MYSQL_DATABASE: db_despachos
      MYSQL_USER: user_despachos
      MYSQL_PASSWORD: pass_despachos
    volumes:
      - mysql-despachos-data:/var/lib/mysql
    networks:
      - back-db
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password_despachos"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s


  # API de Ventas (Spring Boot)
  backend-ventas:
    # Construcción local con Dockerfile
    build:
      context: ./back-Ventas_SpringBoot/Springboot-API-REST
      dockerfile: Dockerfile
    container_name: backend-ventas
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_ENDPOINT: mysql-ventas
      DB_PORT: 3306
      DB_NAME: db_ventas
      DB_USERNAME: user_ventas
      DB_PASSWORD: pass_ventas
      SERVER_PORT: 8080
    # Conectado a la red de front y a la de base de datos
    networks:
      - front-back
      - back-db
    # Espera a que la base de datos responda bien antes de levantar el backend
    depends_on:
      mysql-ventas:
        condition: service_healthy


  # API de Despachos (Spring Boot)
  backend-despachos:
    build:
      context: ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
      dockerfile: Dockerfile
    container_name: backend-despachos
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      DB_ENDPOINT: mysql-despachos
      DB_PORT: 3306
      DB_NAME: db_despachos
      DB_USERNAME: user_despachos
      DB_PASSWORD: pass_despachos
      SERVER_PORT: 8081
    networks:
      - front-back
      - back-db
    depends_on:
      mysql-despachos:
        condition: service_healthy


  # Nginx con el build de React y proxy inverso
  frontend:
    build:
      context: ./front_despacho
      dockerfile: Dockerfile
    container_name: frontend
    restart: unless-stopped
    ports:
      - "80:80"
    # Solo se comunica con los backends
    networks:
      - front-back
    # Arranca despues de las APIs para evitar fallos de proxy en Nginx
    depends_on:
      - backend-ventas
      - backend-despachos


# Redes para aislar el tráfico
networks:
  # Canal frontend <-> backends
  front-back:
    driver: bridge

  # Canal privado backends <-> MySQL
  back-db:
    driver: bridge
    internal: true


# Volúmenes para mantener la persistencia de las bases de datos
volumes:
  mysql-ventas-data:
  mysql-despachos-data:
